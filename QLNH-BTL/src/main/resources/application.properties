# 1. DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://db.znujbhxbddjsygubblsb.supabase.co:5432/postgres?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 3. LOGGING
logging.level.org.springframework=INFO
logging.level.com.example.QLNH_BTL=DEBUG

# 4. DEPLOY CONFIGURATION
spring.main.headless=true
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
